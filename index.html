<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Master Glass">
  <title>Master Glass</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; }

    /* ── Base ── */
    body {
      background: linear-gradient(160deg, #0d1117 0%, #0a1628 55%, #0d1b3e 100%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding-bottom: 84px;
      min-height: 100vh;
      color: #e2e8f0;
    }

    /* ── Logo translúcido de fondo ── */
    .bg-watermark {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 0;
      overflow: hidden; user-select: none;
    }
    .bg-watermark img {
      width: min(80vw, 78vh);
      height: min(80vw, 78vh);
      object-fit: contain;
      opacity: 0.07;
      mix-blend-mode: screen;
    }
    .top-nav, .bottom-nav, #main-content { position: relative; z-index: 1; }

    /* ── Top Nav — vidrio oscuro ── */
    .top-nav {
      position: sticky; top: 0; z-index: 900;
      background: rgba(10,14,26,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: #fff; padding: 13px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .top-nav .brand {
      font-weight: 700; font-size: 1.05rem;
      display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff;
    }
    .top-nav .btn-icon {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; cursor: pointer; transition: background .2s;
    }
    .top-nav .btn-icon:hover { background: rgba(255,255,255,0.18); }

    /* ── Bottom Nav — vidrio oscuro ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,14,26,0.92);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex; z-index: 900;
    }
    .nav-btn {
      flex: 1; border: none; background: none;
      padding: 10px 4px 8px; color: rgba(255,255,255,0.3);
      font-size: 0.63rem; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
      cursor: pointer; transition: color .2s;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .nav-btn i { font-size: 1.35rem; }
    .nav-btn.active { color: #38bdf8; }
    .nav-btn.scan-btn {
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #fff !important;
      border-radius: 50%; width: 58px; height: 58px;
      margin-top: -22px; margin-bottom: 4px;
      flex: 0 0 72px;
      box-shadow: 0 0 28px rgba(14,165,233,0.6), 0 4px 16px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.15);
      transition: transform .15s, box-shadow .15s;
    }
    .nav-btn.scan-btn:hover { transform: scale(1.08); box-shadow: 0 0 38px rgba(14,165,233,0.75), 0 6px 20px rgba(0,0,0,0.5); }
    .nav-btn.scan-btn.active { background: linear-gradient(135deg, #0284c7, #0ea5e9); }

    /* ── Cards — efecto vidrio esmerilado ── */
    .card {
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px !important;
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 28px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.5);
      color: #1e293b;
    }
    /* Tarjeta especial: resumen total */
    .card.card-hero {
      background: linear-gradient(135deg, rgba(14,165,233,0.18) 0%, rgba(56,189,248,0.08) 100%);
      border: 1px solid rgba(56,189,248,0.3);
      color: #e2e8f0;
    }
    .card.card-hero .text-muted { color: rgba(255,255,255,0.6) !important; }
    .card .text-muted { color: #64748b !important; }
    .card .fw-semibold { color: #0f172a; }

    /* ── Warehouse card ── */
    .warehouse-card { border-left: 5px solid; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .warehouse-card:hover { transform: translateX(3px); box-shadow: 0 8px 36px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.5); }

    /* ── Item row ── */
    .item-row { cursor: pointer; transition: box-shadow .12s, transform .12s; }
    .item-row:hover { transform: scale(1.005); box-shadow: 0 6px 28px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5); }

    /* ── Texto sobre fondo oscuro (fuera de tarjetas) ── */
    .text-muted { color: rgba(255,255,255,0.45) !important; }
    .btn-link { text-decoration: none !important; }
    .btn-link.text-muted { color: rgba(255,255,255,0.6) !important; }
    .btn-link.text-muted:hover { color: rgba(255,255,255,0.9) !important; }

    /* ── Botones outline sobre fondo oscuro ── */
    .btn-outline-secondary {
      color: rgba(255,255,255,0.6) !important;
      border-color: rgba(255,255,255,0.22) !important;
      background: rgba(255,255,255,0.05);
    }
    .btn-outline-secondary:hover, .btn-outline-secondary.active {
      background: rgba(255,255,255,0.14) !important;
      color: #fff !important; border-color: rgba(255,255,255,0.38) !important;
    }
    .btn-primary { background: #0ea5e9 !important; border-color: #0ea5e9 !important; }
    .btn-primary:hover { background: #0284c7 !important; border-color: #0284c7 !important; }
    .btn-primary.active, .btn-primary:active { background: #0369a1 !important; border-color: #0369a1 !important; }
    .btn-outline-primary { color: #38bdf8 !important; border-color: rgba(56,189,248,0.5) !important; }
    .btn-outline-primary:hover { background: rgba(56,189,248,0.12) !important; }

    /* ── Status badges ── */
    .badge-available  { background: rgba(220,252,231,.9); color: #15803d; }
    .badge-sold       { background: rgba(254,226,226,.9); color: #dc2626; }
    .badge-merma      { background: rgba(255,247,237,.9); color: #c2410c; }
    .badge-devolucion { background: rgba(239,246,255,.9); color: #1d4ed8; }

    /* ── Status bar ── */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 1rem;
      padding: 8px 14px; border-radius: 999px; width: fit-content;
    }
    .status-bar.available  { background: rgba(220,252,231,.9); color: #15803d; }
    .status-bar.sold       { background: rgba(254,226,226,.9); color: #dc2626; }
    .status-bar.merma      { background: rgba(255,247,237,.9); color: #c2410c; }
    .status-bar.devolucion { background: rgba(239,246,255,.9); color: #1d4ed8; }

    /* ── Loading ── */
    .loading-overlay {
      display: flex; align-items: center; justify-content: center;
      min-height: 180px; flex-direction: column; gap: 12px;
      color: rgba(255,255,255,0.4);
    }

    /* ── QR Grid ── */
    .qr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .qr-item {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 12px; padding: 8px; text-align: center;
    }
    .qr-item .qr-num { font-weight: 800; font-size: .85rem; color: #1e293b; margin-top: 4px; }

    /* ── Scanner ── */
    #qr-reader { border-radius: 18px; overflow: hidden; }
    #qr-reader video { border-radius: 18px; }

    /* ── Print ── */
    @media print {
      .no-print { display: none !important; }
      body { padding: 0 !important; background: #fff !important; }
      .card { background: #fff !important; box-shadow: none !important; border: 1px solid #ddd !important; color: #000 !important; }
      .qr-grid { grid-template-columns: repeat(4, 1fr); }
      .qr-item { border: 1px solid #999 !important; page-break-inside: avoid; background: #fff !important; }
      .bg-watermark { display: none !important; }
    }
    @media (max-width: 400px) {
      .qr-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

<script>
// ══════════════════════════════════════════════════
//  CONFIGURACIÓN FIREBASE
// ══════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAdXcz4K1Dbe_rD0W8h4CXH9klFZhX3ncc",
  authDomain:        "inventario-qr-ce795.firebaseapp.com",
  projectId:         "inventario-qr-ce795",
  storageBucket:     "inventario-qr-ce795.firebasestorage.app",
  messagingSenderId: "224738438926",
  appId:             "1:224738438926:web:7a8bc3da1afbe59065315f"
};

// ══════════════════════════════════════════════════
//  BODEGAS — nombres editables desde Configuración
// ══════════════════════════════════════════════════
const DEFAULT_WAREHOUSES = ['Bodega 1','Bodega 2','Bodega 3','Bodega 4','Bodega 5'];
const WAREHOUSE_COLORS   = ['#1a56db','#16a34a','#ea580c','#dc2626','#7c3aed'];

function getWarehouses() {
  try {
    const saved = localStorage.getItem('warehouses');
    return saved ? JSON.parse(saved) : [...DEFAULT_WAREHOUSES];
  } catch { return [...DEFAULT_WAREHOUSES]; }
}
function saveWarehouses(arr) {
  localStorage.setItem('warehouses', JSON.stringify(arr));
}

// ══════════════════════════════════════════════════
//  FIREBASE INIT
// ══════════════════════════════════════════════════
// Cargar config guardada en localStorage (desde Settings)
(function() {
  const saved = localStorage.getItem('firebaseConfig');
  if (saved) try { Object.assign(FIREBASE_CONFIG, JSON.parse(saved)); } catch {}
})();

let db, firebaseReady = false;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  firebaseReady = true;
} catch(e) { console.warn('Firebase error:', e); }

// ══════════════════════════════════════════════════
//  ESTADO GLOBAL
// ══════════════════════════════════════════════════
let currentScanner = null;
let navHistory = []; // historial de navegación interno
const APP_URL = localStorage.getItem('appUrl') ||
                (window.location.origin + window.location.pathname);

// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════
function formatDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-CL', { day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit' });
}
async function stopScanner() {
  if (currentScanner) {
    try { await currentScanner.stop(); } catch {}
    currentScanner = null;
  }
}
function setNav(view) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const map = { dashboard:'nav-dashboard', scan:'nav-scan', history:'nav-history' };
  if (map[view]) document.getElementById(map[view]).classList.add('active');
}
function loading(text='Cargando...') {
  return `<div class="loading-overlay">
    <div class="spinner-border text-primary"></div><span>${text}</span>
  </div>`;
}
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `alert alert-${type} position-fixed top-0 start-50 translate-middle-x mt-3 shadow`;
  t.style.cssText = 'z-index:9999;min-width:260px;text-align:center;border-radius:999px;font-weight:600';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
function requireFirebase() {
  if (!firebaseReady) {
    document.getElementById('main-content').innerHTML = `
      <div class="alert alert-warning mt-2">
        <h6><i class="bi bi-exclamation-triangle-fill"></i> Firebase no configurado</h6>
        <button class="btn btn-sm btn-warning mt-1" onclick="showView('settings')">Ir a Configuración</button>
      </div>`;
    return false;
  }
  return true;
}

// Etiquetas y estilos por estado
const STATUS_LABELS = {
  available:  { label: 'Disponible',  icon: 'bi-circle-fill',      cls: 'available' },
  sold:       { label: 'Vendido',     icon: 'bi-bag-check-fill',   cls: 'sold' },
  merma:      { label: 'Merma',       icon: 'bi-trash3-fill',      cls: 'merma' },
  devolucion: { label: 'Devolución',  icon: 'bi-arrow-return-left',cls: 'devolucion' },
};
function statusBadge(status) {
  const s = STATUS_LABELS[status] || STATUS_LABELS.available;
  return `<span class="badge rounded-pill badge-${s.cls}">
    <i class="bi ${s.icon}" style="font-size:.6em"></i> ${s.label}
  </span>`;
}

// ══════════════════════════════════════════════════
//  NAVEGACIÓN
// ══════════════════════════════════════════════════
async function showView(view, params={}, addToHistory=true) {
  // Guardar vista actual en historial antes de cambiar
  if (addToHistory && navHistory[navHistory.length-1]?.view !== view) {
    const current = navHistory[navHistory.length-1];
    if (current) navHistory.push({ view, params });
    else navHistory = [{ view, params }];
  }
  await stopScanner();
  setNav(view);
  document.getElementById('main-content').innerHTML = loading();
  switch(view) {
    case 'dashboard':  return renderDashboard();
    case 'scan':       return renderScanner();
    case 'generate':   return renderQRGenerator();
    case 'item':       return renderItemPage(params.id);
    case 'warehouse':  return renderWarehouseDetail(params.name, params.color);
    case 'settings':   return renderSettings();
    case 'history':    return renderHistorial();
  }
}

async function goBack() {
  navHistory.pop(); // quitar vista actual
  const prev = navHistory[navHistory.length - 1];
  if (prev) {
    await showView(prev.view, prev.params, false);
  } else {
    await showView('dashboard', {}, false);
  }
}

// ══════════════════════════════════════════════════
//  VISTA: DASHBOARD
// ══════════════════════════════════════════════════
async function renderDashboard() {
  if (!requireFirebase()) return;
  const WAREHOUSES = getWarehouses();
  const c = document.getElementById('main-content');
  c.innerHTML = `
    <h6 class="text-muted fw-bold mb-3 text-uppercase" style="font-size:.72rem;letter-spacing:.06em">
      Toca una bodega para ver sus artículos
    </h6>
    <div id="wh-cards">${loading()}</div>

    <!-- Actividad Hoy colapsable -->
    <div class="mt-4 mb-1 d-flex align-items-center justify-content-between"
         style="cursor:pointer" data-bs-toggle="collapse" data-bs-target="#activity-collapse">
      <h6 class="text-muted fw-bold mb-0 text-uppercase" style="font-size:.72rem;letter-spacing:.06em">
        <i class="bi bi-sun-fill me-1" style="color:#f59e0b"></i>Actividad de Hoy
        <span id="today-count" class="badge rounded-pill ms-1" style="background:#f59e0b20;color:#b45309;font-size:.68rem"></span>
      </h6>
      <i class="bi bi-chevron-down text-muted" style="font-size:.8rem;transition:transform .2s" id="act-chevron"></i>
    </div>
    <div class="collapse show" id="activity-collapse">
      <div id="activity-list">${loading()}</div>
      <div class="text-center mt-2 mb-1">
        <button class="btn btn-sm btn-outline-secondary" style="font-size:.78rem" onclick="showView('history')">
          <i class="bi bi-clock-history me-1"></i>Ver historial completo
        </button>
      </div>
    </div>
  `;
  // Rotar chevron al colapsar/expandir
  document.getElementById('activity-collapse').addEventListener('hide.bs.collapse', () => {
    document.getElementById('act-chevron').style.transform = 'rotate(-90deg)';
  });
  document.getElementById('activity-collapse').addEventListener('show.bs.collapse', () => {
    document.getElementById('act-chevron').style.transform = 'rotate(0deg)';
  });

  try {
    const snap  = await db.collection('items').get();
    const items = snap.docs.map(d => ({ _id: d.id, ...d.data() }));

    // Estadísticas por bodega
    const stats = {};
    WAREHOUSES.forEach(w => { stats[w] = { total:0, available:0, sold:0, merma:0, devolucion:0 }; });
    items.forEach(it => {
      if (it.warehouse && stats[it.warehouse]) {
        stats[it.warehouse].total++;
        if (stats[it.warehouse][it.status] !== undefined) stats[it.warehouse][it.status]++;
      }
    });

    const totalAvailable  = items.filter(i => i.status === 'available').length;
    const totalSold       = items.filter(i => i.status === 'sold').length;
    const totalMerma      = items.filter(i => i.status === 'merma').length;
    const totalDevolucion = items.filter(i => i.status === 'devolucion').length;

    document.getElementById('wh-cards').innerHTML = `
      <!-- Resumen global -->
      <div class="card card-hero mb-3 p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-bold fs-6">Total registrado</span>
          <span class="badge bg-white text-primary fs-6 fw-bold">${items.length}</span>
        </div>
        <div class="d-flex flex-wrap gap-2" style="font-size:.82rem">
          <span><i class="bi bi-circle-fill" style="font-size:.5em"></i> ${totalAvailable} disponibles</span>
          <span><i class="bi bi-bag-check-fill" style="font-size:.7em"></i> ${totalSold} vendidos</span>
          <span><i class="bi bi-trash3-fill" style="font-size:.7em"></i> ${totalMerma} mermas</span>
          <span><i class="bi bi-arrow-return-left" style="font-size:.7em"></i> ${totalDevolucion} devoluciones</span>
        </div>
      </div>

      ${WAREHOUSES.map((w, i) => `
        <div class="card mb-2 warehouse-card" style="border-left-color:${WAREHOUSE_COLORS[i]}"
             onclick="showView('warehouse',{name:'${w}',color:'${WAREHOUSE_COLORS[i]}'})">
          <div class="card-body py-2 px-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold" style="color:${WAREHOUSE_COLORS[i]}">
                <i class="bi bi-building"></i> ${w}
              </span>
              <div class="d-flex align-items-center gap-1">
                <span class="badge rounded-pill" style="background:${WAREHOUSE_COLORS[i]}20;color:${WAREHOUSE_COLORS[i]}">
                  ${stats[w]?.total || 0} artículos
                </span>
                <i class="bi bi-chevron-right text-muted" style="font-size:.75rem"></i>
              </div>
            </div>
            <div class="mt-1 d-flex flex-wrap gap-1">
              <span class="badge rounded-pill badge-available">✓ ${stats[w]?.available || 0} disp.</span>
              <span class="badge rounded-pill badge-sold">🛍 ${stats[w]?.sold || 0} vend.</span>
              ${stats[w]?.merma > 0 ? `<span class="badge rounded-pill badge-merma">⚠ ${stats[w].merma} merma</span>` : ''}
              ${stats[w]?.devolucion > 0 ? `<span class="badge rounded-pill badge-devolucion">↩ ${stats[w].devolucion} dev.</span>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    `;

    // Actividad de hoy
    const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
    const todayItems = items
      .filter(i => {
        const ts = i.soldAt || i.registeredAt;
        if (!ts) return false;
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d >= startOfToday;
      })
      .sort((a, b) => {
        const tA = a.soldAt?.toMillis?.() || a.registeredAt?.toMillis?.() || 0;
        const tB = b.soldAt?.toMillis?.() || b.registeredAt?.toMillis?.() || 0;
        return tB - tA;
      });

    const countEl = document.getElementById('today-count');
    if (countEl) countEl.textContent = todayItems.length > 0 ? todayItems.length : '';

    document.getElementById('activity-list').innerHTML = todayItems.length === 0
      ? '<p class="text-muted text-center py-3"><i class="bi bi-moon-stars me-1"></i>Sin actividad hoy todavía</p>'
      : todayItems.map(it => {
          const wIdx = WAREHOUSES.indexOf(it.warehouse);
          const color = wIdx >= 0 ? WAREHOUSE_COLORS[wIdx] : '#64748b';
          return `
          <div class="card mb-2 item-row" onclick="showView('item',{id:'${it._id}'})">
            <div class="card-body py-2 px-3 d-flex align-items-center gap-3">
              <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                style="background:${color}18;color:${color};width:38px;height:38px;font-weight:800;font-size:.82rem">
                #${it._id}
              </div>
              <div class="flex-grow-1 overflow-hidden">
                <div class="fw-semibold text-truncate">${it.description || 'Sin descripción'}</div>
                <div class="text-muted small">${it.warehouse || '—'}</div>
              </div>
              ${statusBadge(it.status)}
            </div>
          </div>`;
        }).join('');

  } catch(e) {
    document.getElementById('wh-cards').innerHTML = `
      <div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill"></i>
        Error al conectar con Firebase.<br><small>${e.message}</small></div>`;
  }
}

function filterItems(status, btn) {
  document.querySelectorAll('#filter-btns .btn').forEach(b => {
    b.classList.remove('active','btn-primary','btn-success','btn-danger','btn-warning','btn-primary');
    if (!b.classList.contains('btn-outline-success') &&
        !b.classList.contains('btn-outline-danger') &&
        !b.classList.contains('btn-outline-warning') &&
        !b.classList.contains('btn-outline-primary')) {
      b.classList.add('btn-outline-secondary');
    }

  const filtered = status === 'all' ? all : all.filter(i => i.status === status);

function getItemActivityDate(it) {
  const ts = it.soldAt || it.registeredAt;
  if (!ts) return null;
  return ts.toDate ? ts.toDate() : new Date(ts);
}

async function renderHistorial() {
  if (!requireFirebase()) return;
  const c = document.getElementById('main-content');
  c.innerHTML = `
    <h5 class="fw-bold mb-3"><i class="bi bi-clock-history me-2"></i>Historial</h5>
    <div class="d-flex gap-2 mb-3 flex-wrap" id="hist-filter-btns">
      <button class="btn btn-sm btn-primary active" onclick="filterHistorial('today',this)">Hoy</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="filterHistorial('yesterday',this)">Ayer</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="filterHistorial('week',this)">Últimos 7 días</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="filterHistorial('month',this)">Este mes</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="filterHistorial('all',this)">Todo</button>
    </div>
    <div id="hist-list">${loading('Cargando historial...')}</div>
  `;
  try {
    const snap = await db.collection('items').get();
    window._histItems = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    renderHistItems('today');
  } catch(e) {
    document.getElementById('hist-list').innerHTML =
      `<div class="alert alert-danger">Error: ${e.message}</div>`;
  }
}

function filterHistorial(period, btn) {
  document.querySelectorAll('#hist-filter-btns .btn').forEach(b => {
    b.classList.remove('active','btn-primary');
    if (!b.classList.contains('btn-outline-secondary')) b.classList.add('btn-outline-secondary');
  });
  btn.classList.remove('btn-outline-secondary');
  btn.classList.add('active','btn-primary');
  renderHistItems(period);
}

function renderHistItems(period) {
  const WAREHOUSES = getWarehouses();
  const all = window._histItems || [];
  const now = new Date();
  const startOfToday   = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfYest    = new Date(startOfToday); startOfYest.setDate(startOfYest.getDate()-1);
  const startOfWeek    = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate()-7);
  const startOfMonth   = new Date(now.getFullYear(), now.getMonth(), 1);

  let filtered = all.filter(it => {
    const d = getItemActivityDate(it);
    if (!d) return period === 'all';
    switch(period) {
      case 'today':     return d >= startOfToday;
      case 'yesterday': return d >= startOfYest && d < startOfToday;
      case 'week':      return d >= startOfWeek;
      case 'month':     return d >= startOfMonth;
      default:          return true;
    }
  });

  filtered.sort((a, b) => {
    const dA = getItemActivityDate(a)?.getTime() || 0;
    const dB = getItemActivityDate(b)?.getTime() || 0;
    return dB - dA;
  });

  const el = document.getElementById('hist-list');
  if (filtered.length === 0) {
    el.innerHTML = '<p class="text-muted text-center py-4"><i class="bi bi-inbox fs-2 d-block mb-2"></i>Sin actividad en este período</p>';
    return;
  }

  // Agrupar por día
  const groups = {};
  filtered.forEach(it => {
    const d = getItemActivityDate(it);
    const key = d
      ? d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
      : 'Sin fecha';
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });

  el.innerHTML = Object.entries(groups).map(([day, dayItems]) => `
    <div class="mb-3">
      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="fw-bold text-capitalize" style="font-size:.78rem;color:#475569">${day}</div>
        <span class="badge rounded-pill" style="background:#e2e8f0;color:#64748b;font-size:.68rem">
          ${dayItems.length} artículo${dayItems.length!==1?'s':''}
        </span>
      </div>
      ${dayItems.map(it => {
        const wIdx = WAREHOUSES.indexOf(it.warehouse);
        const color = wIdx >= 0 ? WAREHOUSE_COLORS[wIdx] : '#64748b';
        const d = getItemActivityDate(it);
        const hora = d ? d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) : '';
        return `
        <div class="card mb-2 item-row" onclick="showView('item',{id:'${it._id}'})">
          <div class="card-body py-2 px-3 d-flex align-items-center gap-3">
            <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
              style="background:${color}18;color:${color};width:38px;height:38px;font-weight:800;font-size:.82rem">
              #${it._id}
            </div>
            <div class="flex-grow-1 overflow-hidden">
              <div class="fw-semibold text-truncate">${it.description || 'Sin descripción'}</div>
              <div class="text-muted small">${it.warehouse || '—'}${hora ? ' · ' + hora : ''}</div>
            </div>
            ${statusBadge(it.status)}
          </div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

function renderScanner() {
  const c = document.getElementById('main-content');
  c.innerHTML = `
    <h6 class="text-muted fw-bold mb-3 text-uppercase" style="font-size:.72rem;letter-spacing:.06em">
      Escanear Código QR
    </h6>
    <div id="qr-reader" class="mb-3" style="width:100%;max-width:420px;margin:auto"></div>
    <p class="text-center text-muted small" id="scan-hint">
      <i class="bi bi-camera"></i> Apunta la cámara al código QR
    </p>
    <hr class="my-3">
    <p class="text-muted small mb-1">¿Sin cámara? Ingresa el número manualmente:</p>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-hash"></i></span>
      <input type="number" class="form-control form-control-lg" id="manual-id"
        placeholder="Número del artículo" min="1" inputmode="numeric">
      <button class="btn btn-primary px-4" onclick="goToItem(document.getElementById('manual-id').value)">
        Ir <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  `;

  document.getElementById('manual-id').addEventListener('keydown', e => {
    if (e.key === 'Enter') goToItem(e.target.value);
  });

  const scanner = new Html5Qrcode('qr-reader');
  currentScanner = scanner;
  let alreadyScanned = false;

  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    (decoded) => {
      if (alreadyScanned) return;
      alreadyScanned = true;

      const hint = document.getElementById('scan-hint');

      // Extraer número del QR
      let itemId = null;

      // Caso 1: URL con ?item=N  (QR generado desde la app)
      try {
        const url = new URL(decoded);
        const p = url.searchParams.get('item');
        if (p && !isNaN(parseInt(p))) itemId = String(parseInt(p));
      } catch {}

      // Caso 2: el QR contiene solo un número
      if (!itemId) {
        const num = parseInt(decoded.trim());
        if (!isNaN(num) && num > 0) itemId = String(num);
      }

      if (!itemId) {
        setTimeout(() => { alreadyScanned = false; }, 2000);
        return;
      }

      if (hint) hint.innerHTML = `<span class="text-success fw-bold fs-6">
        <i class="bi bi-check-circle-fill"></i> Código detectado…</span>`;

      try { scanner.stop().catch(() => {}); } catch {}
      currentScanner = null;
      setTimeout(() => showView('item', { id: itemId }), 300);
    },
    () => {}
  ).catch(() => {
    document.getElementById('scan-hint').innerHTML =
      '<i class="bi bi-exclamation-triangle text-warning"></i> No se pudo acceder a la cámara. Usa el ingreso manual.';
  });
}

function goToItem(id) {
  const num = parseInt(String(id).trim());
  if (!isNaN(num) && num > 0) showView('item', { id: String(num) });
}

function confirmBaja(itemId, status) {
  const labels = { sold:'Vendido', merma:'Merma', devolucion:'Devolución' };
  const colors = { sold:'danger', merma:'warning', devolucion:'primary' };
  const bar = document.getElementById('confirm-baja-bar');
  bar.innerHTML = `
    <div class="alert alert-${colors[status]} mt-2">
      <strong>¿Confirmas marcar como <u>${labels[status]}</u>?</strong>
      <div class="d-flex gap-2 mt-2">
        <button class="btn btn-${colors[status]} flex-grow-1" onclick="doBaja('${itemId}','${status}')">
          Sí, confirmar
        </button>
        <button class="btn btn-outline-secondary" onclick="document.getElementById('confirm-baja-bar').innerHTML=''">
          Cancelar
        </button>
      </div>
    </div>`;
}

async function doBaja(itemId, status) {
  try {
    await db.collection('items').doc(String(itemId)).update({
      status,
      closedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    const labels = { sold:'Vendido', merma:'Merma', devolucion:'Devolución' };
    toast(`✓ Marcado como ${labels[status]}`);
    renderItemPage(itemId);
  } catch(e) {
    toast('Error: ' + e.message, 'danger');
  }
}

async function registerItem(itemId) {
  const desc      = document.getElementById('inp-desc').value.trim();
  const warehouse = document.getElementById('inp-warehouse').value;
  if (!desc)      { toast('Ingresa una descripción', 'warning'); return; }
  if (!warehouse) { toast('Selecciona una bodega', 'warning'); return; }

  const btn = document.querySelector('#item-body .btn-primary');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';

  try {
    await db.collection('items').doc(String(itemId)).set({
      description: desc, warehouse, status: 'available',
      registeredAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✓ Artículo registrado correctamente');
    renderItemPage(itemId);
  } catch(e) {
    toast('Error: ' + e.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-lg"></i> Registrar en Bodega';
  }
}

function showTransfer() {
  document.getElementById('transfer-form').classList.remove('d-none');
}
async function doTransfer(itemId, newWarehouse) {
  try {
    await db.collection('items').doc(String(itemId)).update({
      warehouse: newWarehouse,
      transferredAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast(`✓ Transferido a ${newWarehouse}`);
    renderItemPage(itemId);
  } catch(e) {
    toast('Error: ' + e.message, 'danger');
  }
}

async function renderQRGenerator() {

  c.innerHTML = loading('Cargando...');

  // Cargar conteo desde Firebase
  let lastGenerated = 0;
  try {
    const doc = await db.collection('config').doc('qr_counter').get();
    if (doc.exists) lastGenerated = doc.data().last || 0;
  } catch {}

  const nextFrom = lastGenerated + 1;
  const nextTo   = lastGenerated + 20;

  c.innerHTML = `
    <h6 class="text-muted fw-bold mb-3 text-uppercase" style="font-size:.72rem;letter-spacing:.06em">
      Generar Códigos QR para Imprimir
    </h6>

    <!-- Contador total -->
    <div class="card mb-3 p-3" style="background:linear-gradient(135deg,#1a56db,#3b82f6);color:#fff">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <div style="font-size:.75rem;opacity:.85;text-transform:uppercase;letter-spacing:.05em">Total QR generados</div>
          <div class="fw-black" style="font-size:2rem;line-height:1">${lastGenerated.toLocaleString('es-CL')}</div>
        </div>
        <i class="bi bi-qr-code" style="font-size:2.5rem;opacity:.4"></i>
      </div>
      ${lastGenerated > 0 ? `
        <div class="mt-2" style="font-size:.82rem;opacity:.9">
          Último generado: <strong>#${lastGenerated}</strong> — el próximo es <strong>#${nextFrom}</strong>
        </div>` : `
        <div class="mt-2" style="font-size:.82rem;opacity:.9">Aún no se han generado códigos</div>`}
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-5">
            <label class="form-label fw-semibold">Desde</label>
            <input type="number" class="form-control form-control-lg" id="qr-from"
              value="${nextFrom}" min="1" inputmode="numeric">
          </div>
          <div class="col-5">
            <label class="form-label fw-semibold">Hasta</label>
            <input type="number" class="form-control form-control-lg" id="qr-to"
              value="${nextTo}" min="1" inputmode="numeric">
          </div>
          <div class="col-2 text-muted text-center">
            <small id="qr-count">20 QR</small>
          </div>
        </div>
        <button class="btn btn-primary w-100 mt-3 btn-lg" onclick="generateQRCodes()">
          <i class="bi bi-qr-code"></i> Generar
        </button>
      </div>
    </div>
    <div id="qr-output"></div>
  `;

  function updateCount() {
    const f = parseInt(document.getElementById('qr-from').value) || 0;
    const t = parseInt(document.getElementById('qr-to').value) || 0;
    document.getElementById('qr-count').textContent = `${Math.max(0,t-f+1)} QR`;
  }
  document.getElementById('qr-from').addEventListener('input', updateCount);
  document.getElementById('qr-to').addEventListener('input', updateCount);
  updateCount();
}

async function generateQRCodes() {
  const from = parseInt(document.getElementById('qr-from').value);
  const to   = parseInt(document.getElementById('qr-to').value);
  if (isNaN(from)||isNaN(to)||from<1) { toast('Ingresa números válidos','warning'); return; }
  if (to < from) { toast('El número final debe ser mayor al inicial','warning'); return; }
  if ((to-from+1) > 500) { toast('Máximo 500 códigos a la vez','warning'); return; }

  const ids = Array.from({length: to-from+1}, (_,i) => from+i);

  // Guardar el número más alto generado en Firebase
  try {
    const ref = db.collection('config').doc('qr_counter');
    const doc = await ref.get();
    const currentLast = doc.exists ? (doc.data().last || 0) : 0;
    if (to > currentLast) {
      await ref.set({ last: to, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
  } catch(e) { console.warn('No se pudo guardar el contador:', e); }

  document.getElementById('qr-output').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-3 no-print flex-wrap gap-2">
      <div>
        <span class="fw-bold">${ids.length} códigos generados</span>
        <span class="text-muted small ms-2">del #${from} al #${to}</span>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-primary btn-sm" id="btn-word" onclick="exportToWord(${from},${to})">
          <i class="bi bi-file-earmark-word-fill"></i> Descargar Word
        </button>
        <button class="btn btn-success btn-sm" onclick="window.print()">
          <i class="bi bi-printer"></i> Imprimir
        </button>
      </div>
    </div>
    <div class="qr-grid" id="qr-grid">
      ${ids.map(n => `
        <div class="qr-item">
          <div id="qr-${n}" style="display:flex;justify-content:center"></div>
          <div class="qr-num">#${n}</div>
        </div>`).join('')}
    </div>`;

  const appUrl = localStorage.getItem('appUrl') || APP_URL;
  let i = 0;
  function batch() {
    const end = Math.min(i+20, ids.length);
    for (; i < end; i++) {
      const n = ids[i];
      const el = document.getElementById(`qr-${n}`);
      if (el) new QRCode(el, { text:`${appUrl}?item=${n}`, width:72, height:72, correctLevel:QRCode.CorrectLevel.M });
    }
    if (i < ids.length) requestAnimationFrame(batch);
  }
  requestAnimationFrame(batch);
}

// ══════════════════════════════════════════════════
//  VISTA: CONFIGURACIÓN
// ══════════════════════════════════════════════════
function renderSettings() {
  const c = document.getElementById('main-content');
  const WAREHOUSES = getWarehouses();

  c.innerHTML = `
    <button class="btn btn-link ps-0 mb-2 text-muted" onclick="goBack()">
      <i class="bi bi-arrow-left"></i> Volver
    </button>
    <h5 class="mb-3">Configuración</h5>

    <!-- Acceso rápido: Generar QR -->
    <div class="card mb-3" style="border-left:4px solid #1a56db;cursor:pointer" onclick="showView('generate')">
      <div class="card-body py-3 d-flex align-items-center gap-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
          style="background:#1a56db18;color:#1a56db;width:44px;height:44px;font-size:1.3rem">
          <i class="bi bi-printer-fill"></i>
        </div>
        <div class="flex-grow-1">
          <div class="fw-bold">Generar códigos QR</div>
          <div class="text-muted small">Imprimir o exportar a Word</div>
        </div>
        <i class="bi bi-chevron-right text-muted"></i>
      </div>
    </div>

    <!-- Bodegas -->
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="mb-1"><i class="bi bi-building"></i> Bodegas / Camionetas</h6>
        <p class="text-muted small mb-3">Agrega, renombra o elimina según tus vehículos o patentes.</p>
        <div id="wh-list">
          ${WAREHOUSES.map((w, i) => `
            <div class="input-group mb-2" id="wh-row-${i}">
              <span class="input-group-text fw-bold"
                style="background:${WAREHOUSE_COLORS[i % WAREHOUSE_COLORS.length]}20;
                       color:${WAREHOUSE_COLORS[i % WAREHOUSE_COLORS.length]};
                       width:36px;justify-content:center">
                ${i+1}
              </span>
              <input type="text" class="form-control" id="wh-${i}" value="${w}" maxlength="40"
                placeholder="Ej: Camioneta ABCD-12">
              <button class="btn btn-outline-danger" onclick="removeWarehouse(${i})" title="Eliminar">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          `).join('')}
        </div>

        <!-- Agregar nueva -->
        <button class="btn btn-outline-primary w-100 mt-1 mb-3" onclick="addWarehouseRow()">
          <i class="bi bi-plus-lg"></i> Agregar bodega
        </button>

        <div class="d-flex gap-2">
          <button class="btn btn-primary flex-grow-1" onclick="saveWarehouseNames()">
            <i class="bi bi-check-lg"></i> Guardar cambios
          </button>
          <button class="btn btn-outline-secondary" onclick="resetWarehouseNames()">
            Restablecer
          </button>
        </div>
      </div>
    </div>
  `;
}

function addWarehouseRow() {
  const list = document.getElementById('wh-list');
  const rows = list.querySelectorAll('.input-group');
  const i = rows.length;
  if (i >= WAREHOUSE_COLORS.length * 2) { toast('Máximo 10 bodegas', 'warning'); return; }
  const color = WAREHOUSE_COLORS[i % WAREHOUSE_COLORS.length];
  const div = document.createElement('div');
  div.className = 'input-group mb-2';
  div.id = `wh-row-${i}`;
  div.innerHTML = `
    <span class="input-group-text fw-bold"
      style="background:${color}20;color:${color};width:36px;justify-content:center">${i+1}</span>
    <input type="text" class="form-control" id="wh-${i}" placeholder="Ej: Camioneta ABCD-12" maxlength="40">
    <button class="btn btn-outline-danger" onclick="removeWarehouse(${i})" title="Eliminar">
      <i class="bi bi-trash3"></i>
    </button>`;
  list.appendChild(div);
}

function removeWarehouse(idx) {
  const rows = document.getElementById('wh-list').querySelectorAll('.input-group');
  if (rows.length <= 1) { toast('Debe quedar al menos una bodega', 'warning'); return; }
  const row = document.getElementById(`wh-row-${idx}`);
  if (row) row.remove();
  // Re-numerar visualmente
  document.getElementById('wh-list').querySelectorAll('.input-group').forEach((r, i) => {
    r.id = `wh-row-${i}`;
    const span  = r.querySelector('span');
    const input = r.querySelector('input');
    const btn   = r.querySelector('button');
    const color = WAREHOUSE_COLORS[i % WAREHOUSE_COLORS.length];
    if (span)  { span.textContent = i+1; span.style.background = `${color}20`; span.style.color = color; }
    if (input) { input.id = `wh-${i}`; }
    if (btn)   { btn.setAttribute('onclick', `removeWarehouse(${i})`); }
  });
}

function saveWarehouseNames() {
  const inputs = document.getElementById('wh-list').querySelectorAll('input');
  const names = Array.from(inputs).map((inp, i) => inp.value.trim() || `Bodega ${i+1}`);
  if (new Set(names).size !== names.length) {
    toast('Los nombres deben ser únicos', 'warning'); return;
  }
  saveWarehouses(names);
  toast('✓ Nombres guardados. Recargando...');
  setTimeout(() => location.reload(), 1200);
}
function resetWarehouseNames() {
  saveWarehouses([...DEFAULT_WAREHOUSES]);
  toast('✓ Nombres restablecidos');
  setTimeout(() => renderSettings(), 600);
}
function saveAppUrl() {
  const url = document.getElementById('app-url-input').value.trim();
  if (!url) { toast('Ingresa una URL válida','warning'); return; }
  localStorage.setItem('appUrl', url);
  toast('✓ URL guardada');
}

// ══════════════════════════════════════════════════
//  EXPORTAR A WORD
// ══════════════════════════════════════════════════
async function exportToWord(from, to) {
  const btn = document.getElementById('btn-word');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Generando...'; }

  try {
    const { Document, Packer, Table, TableRow, TableCell, Paragraph,
            ImageRun, TextRun, AlignmentType, WidthType, BorderStyle } = window.docx;

    const ids = Array.from({ length: to - from + 1 }, (_, i) => from + i);

    // Capturar cada QR del DOM como ArrayBuffer PNG
    const images = [];
    for (const n of ids) {
      const el = document.getElementById(`qr-${n}`);
      const canvas = el?.querySelector('canvas');
      if (canvas) {
        const buf = await new Promise((res, rej) => {
          canvas.toBlob(blob => {
            const reader = new FileReader();
            reader.onload  = () => res(reader.result);
            reader.onerror = rej;
            reader.readAsArrayBuffer(blob);
          }, 'image/png');
        });
        images.push({ n, buffer: buf });
      }
    }

    if (images.length === 0) { toast('No se encontraron QR para exportar', 'warning'); return; }

    // Layout: 4 columnas, tamaño carta
    const COLS       = 4;
    const PAGE_W     = 12240; // carta en DXA
    const MARGIN     = 720;   // ~0.5 inch
    const TABLE_W    = PAGE_W - MARGIN * 2;
    const CELL_W     = Math.floor(TABLE_W / COLS);
    const QR_PX      = 110;   // tamaño imagen en puntos

    const noBorder = { style: BorderStyle.SINGLE, size: 4, color: 'CCCCCC' };

    const buildRow = (rowItems) =>
      new TableRow({
        children: rowItems.map(item =>
          new TableCell({
            width: { size: CELL_W, type: WidthType.DXA },
            borders: { top: noBorder, bottom: noBorder, left: noBorder, right: noBorder },
            children: item ? [
              new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { before: 80, after: 40 },
                children: [new ImageRun({
                  data: item.buffer,
                  type: 'png',
                  transformation: { width: QR_PX, height: QR_PX }
                })]
              }),
              new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { before: 0, after: 80 },
                children: [new TextRun({ text: `#${item.n}`, bold: true, size: 18 })]
              }),
            ] : [new Paragraph('')]
          })
        )
      });

    // Agrupar en filas de COLS
    const rows = [];
    for (let i = 0; i < images.length; i += COLS) {
      const chunk = Array.from({ length: COLS }, (_, j) => images[i + j] || null);
      rows.push(buildRow(chunk));
    }

    const doc = new Document({
      sections: [{
        properties: { page: { size: { width: PAGE_W, height: 15840 }, margin: { top: MARGIN, bottom: MARGIN, left: MARGIN, right: MARGIN } } },
        children: [
          new Table({
            columnWidths: Array(COLS).fill(CELL_W),
            width: { size: TABLE_W, type: WidthType.DXA },
            rows
          })
        ]
      }]
    });

    const blob = await Packer.toBlob(doc);
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `MasterGlass-QR-${from}-al-${to}.docx`;
    a.click();
    URL.revokeObjectURL(url);
    toast(`✓ Word descargado — ${images.length} códigos`);

  } catch(e) {
    toast('Error al generar Word: ' + e.message, 'danger');
    console.error(e);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-file-earmark-word-fill"></i> Descargar Word'; }
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const itemId = params.get('item');
  if (itemId && !isNaN(Number(itemId))) {
    showView('item', { id: itemId });
  } else {
    showView('dashboard');
  }
});
